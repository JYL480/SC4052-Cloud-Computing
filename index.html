<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="style.css" rel="stylesheet" type="text/css" media="screen" />
    <title>Fat Tree Visualizer</title>
  </head>

  <body>
    <div class="control">
      <form>
        <ul>
          <li>
            <span class="f">Topology Type</span>
            <select name="topology" id="topology">
              <option value="fattree">Fat Tree (Classic)</option>
              <option value="jupiter">Google Jupiter</option>
              <option value="dragonfly">Dragonfly</option>
              <option value="leafspine">Leaf-Spine (Clos)</option>
              <option value="ai-optimized">AI-Optimized Fabric</option>
            </select>
          </li>
          <li>
            <span class="f">Tree Depth</span>
            <input type="text" name="depth" value="3" />
          </li>
          <li>
            <span class="f">Ports per Switch</span>
            <input type="text" name="width" value="16" />
          </li>
          <li id="gpu-config" style="display: none">
            <span class="f">GPUs per Server</span>
            <input type="text" name="gpus" value="8" />
          </li>
          <li id="cpu-config" style="display: none">
            <span class="f">CPU:GPU Ratio</span>
            <input type="text" name="cpuGpuRatio" value="1:2" />
          </li>
          <li><span class="f">Hosts</span> <span id="nhost"></span></li>
          <li><span class="f">Switches</span> <span id="nswitch"></span></li>
          <li><span class="f">Cables</span> <span id="ncable"></span></li>
          <li><span class="f">Transmitters</span> <span id="ntx"></span></li>
          <li><span class="f">Switch Tx's</span> <span id="nswtx"></span></li>
          <li id="ai-stats" style="display: none">
            <span class="f">Total GPUs</span> <span id="ngpu"></span>
          </li>
          <li id="bandwidth-stats" style="display: none">
            <span class="f">Bisection BW</span> <span id="bisectionbw"></span>
          </li>
        </ul>
      </form>
      <div class="comment">
        Enhanced Fat Tree & DC Topology Visualizer<br />Original by
        <a href="http://cseweb.ucsd.edu/~h8liu">He "Lonnie" Liu</a
        ><br />Extended for SOTA Architectures
      </div>
    </div>

    <script
      language="javascript"
      type="text/javascript"
      src="lib/jquery.js"
    ></script>
    <script
      language="javascript"
      type="text/javascript"
      src="lib/d3.js"
    ></script>
    <script
      language="javascript"
      type="text/javascript"
      src="ftree.js"
    ></script>
  </body>
</html>
